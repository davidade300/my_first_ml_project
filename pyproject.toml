[project]
name = "ml-model"
version = "0.1.0"
description = ""
authors = [
    {name = "David Aderaldo",email = "iaderinho@icloud.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel (>=7.4.0,<8.0.0)",
    "pandas (>=3.1.1,<4.0.0)",
    "numpy (>=2.5.5,<3.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "python-calamine (>=0.9.1,<0.10.0)"
]

[tool.poetry]
packages = [{include = "ml_model", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
